name: Google Play internal
run-name: Internal build ${{ inputs.version_name }} · upload=${{ inputs.upload }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Display version (for example 1.1.0)
        required: true
        default: '1.1.0'
        type: string
      upload:
        description: Upload the signed bundle to Google Play
        default: false
        type: boolean
      release_status:
        description: draft = Console review; completed = distribute to internal testers
        default: draft
        type: choice
        options: [draft, completed]

permissions:
  contents: read

concurrency:
  group: google-play-internal
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  bundle:
    needs: checks
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: play-internal
    timeout-minutes: 30
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Calculate version code
        id: version
        env:
          VERSION_BASE: ${{ vars.PLAY_VERSION_CODE_BASE || '1000' }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: python3 scripts/release_version.py
      - name: Check signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('Configure environment secrets: ' + ', '.join(missing))
          path = Path(os.environ['RUNNER_TEMP']) / 'upload-key.jks'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Build signed bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          ./gradlew :app:bundleRelease -PrequireReleaseSigning=true \
            "-PreleaseVersionCode=$VERSION_CODE" "-PreleaseVersionName=$VERSION_NAME" --no-daemon --console=plain
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/bundle-verification.txt"
          grep -q 'jar verified.' "$RUNNER_TEMP/bundle-verification.txt"
      - name: Keep bundle and mapping
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: play-internal-bundle
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-key.jks"

  upload:
    needs: bundle
    if: inputs.upload && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: play-internal
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check Google configuration
        env:
          PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" || { echo 'Set GCP_WORKLOAD_IDENTITY_PROVIDER in play-internal'; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo 'Set GCP_SERVICE_ACCOUNT in play-internal'; exit 1; }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: play-internal-bundle
          path: release
      - name: Authenticate to Google Play
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Upload internal release
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          RELEASE_STATUS: ${{ inputs.release_status }}
          VERSION_CODE: ${{ needs.bundle.outputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          python3 scripts/publish_internal.py \
            --bundle release/bundle/release/app-release.aab \
            --mapping release/mapping/release/mapping.txt \
            --version-code "$VERSION_CODE" --release-name "$VERSION_NAME" --status "$RELEASE_STATUS"
