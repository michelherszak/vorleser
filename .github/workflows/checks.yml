name: Android checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: jetbrains
          java-version: '25'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test delivery tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Build, test and lint Android
        run: ./gradlew :app:assembleDebug :app:bundleRelease :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Keep test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 7
